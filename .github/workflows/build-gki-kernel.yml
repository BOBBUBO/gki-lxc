name: Build GKI Kernel (android-12-5.10) with LXC/Docker Support

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch to build'
        required: true
        default: 'android12-5.10'
        type: choice
        options:
          - android12-5.10
          - android13-5.15
          - android14-6.1
      enable_debug:
        description: 'Enable debug configs'
        required: false
        default: false
        type: boolean

  push:
    branches: [main, master]
    paths:
      - 'build_gki_kernel.sh'
      - '.github/workflows/build-gki-kernel.yml'
      - 'configs/*.config'

  schedule:
    - cron: '0 2 * * 0'

env:
  DEFAULT_KERNEL_VERSION: android12-5.10
  DEFAULT_ENABLE_DEBUG: 'false'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential libssl-dev libncurses5-dev \
            bison flex libelf-dev bc cpio rsync \
            python3 python3-pip python3-setuptools \
            device-tree-compiler lz4 lzop \
            ccache pigz qemu-user-static

      - name: Set up toolchain
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

          mkdir -p toolchain
          cd toolchain

          if [[ ! -d "aarch64-linux-android-4.9" ]]; then
            git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
            cd aarch64-linux-android-4.9
            git lfs pull
            cd ..
          fi

          if [[ ! -d "arm-linux-androideabi-4.9" ]]; then
            git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
            cd arm-linux-androideabi-4.9
            git lfs pull
            cd ..
          fi

          # Verify toolchain binaries exist
          ls -la aarch64-linux-android-4.9/bin/
          ls -la arm-linux-androideabi-4.9/bin/

          echo "TOOLCHAIN_PATH=$PWD/aarch64-linux-android-4.9/bin:$PWD/arm-linux-androideabi-4.9/bin" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch || env.DEFAULT_KERNEL_VERSION }}"
          git clone --depth 1 -b "$BRANCH" \
            https://android.googlesource.com/kernel/common kernel

      - name: Configure kernel (GKI + LXC/Docker)
        env:
          PATH: ${{ env.TOOLCHAIN_PATH }}:/usr/bin:$PATH
        run: |
          cd kernel

          # Base GKI config
          make O=../out gki_defconfig

          # Apply LXC/Docker configs
          cat ../configs/lxc-docker.config >> ../out/.config

          # Debug configs if enabled
          DEBUG_FLAG="${{ github.event.inputs.enable_debug || env.DEFAULT_ENABLE_DEBUG }}"
          if [[ "$DEBUG_FLAG" == "true" ]]; then
            cat ../configs/debug.config >> ../out/.config
          fi

          # Resolve dependencies
          make O=../out olddefconfig

      - name: Build kernel
        env:
          PATH: ${{ env.TOOLCHAIN_PATH }}:/usr/bin:$PATH
        run: |
          cd kernel

          # Set up ccache
          export CCACHE_DIR="${{ github.workspace }}/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G

          export CC="ccache aarch64-linux-android-gcc"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export SUBARCH=arm64

          make O=../out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc) \
            2>&1 | tee ../build.log

      - name: Package kernel artifacts
        run: |
          mkdir -p out/dist

          # Copy Image
          find out -name "Image" -exec cp {} out/dist/ \;

          # Copy DTBs
          find out -name "*.dtb" -exec cp {} out/dist/ \;

          # Copy modules
          find out -name "*.ko" -exec cp {} out/dist/ \;

          # Create kernel version file
          if [[ -f out/.config ]]; then
            grep "CONFIG_LOCALVERSION=" out/.config | cut -d'"' -f2 > out/dist/kernel_version.txt || echo "unknown" > out/dist/kernel_version.txt
          fi

          ls -la out/dist/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-${{ github.event.inputs.kernel_branch || env.DEFAULT_KERNEL_VERSION }}-lxc-docker
          path: |
            out/dist/**
            build.log
          retention-days: 30

      - name: Upload ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-${{ runner.os }}-${{ github.event.inputs.kernel_branch || env.DEFAULT_KERNEL_VERSION }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.kernel_branch || env.DEFAULT_KERNEL_VERSION }}
            ccache-${{ runner.os }}-

      - name: Build summary
        if: always()
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch || env.DEFAULT_KERNEL_VERSION }}"
          DEBUG_FLAG="${{ github.event.inputs.enable_debug || env.DEFAULT_ENABLE_DEBUG }}"
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Version**: $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug Enabled**: $DEBUG_FLAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [[ -f out/dist/Image ]]; then
            echo "- **Kernel Image**: ✅ Built" >> $GITHUB_STEP_SUMMARY
            ls -lh out/dist/Image >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Kernel Image**: ❌ Not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### LXC/Docker Support" >> $GITHUB_STEP_SUMMARY
          echo "All required kernel configs for LXC/Docker have been enabled." >> $GITHUB_STEP_SUMMARY