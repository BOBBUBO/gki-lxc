name: Build GKI Kernel (android-12-5.10) with LXC/Docker Support

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch to build'
        required: true
        default: 'android-12-5.10'
        type: choice
        options:
          - android-12-5.10
          - android13-5.15
          - android14-6.1
      enable_debug:
        description: 'Enable debug configs'
        required: false
        default: false
        type: boolean

  push:
    branches: [main, master]
    paths:
      - 'build_gki_kernel.sh'
      - '.github/workflows/build-gki-kernel.yml'

  schedule:
    - cron: '0 2 * * 0'

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_branch || 'android-12-5.10' }}
  ENABLE_DEBUG: ${{ github.event.inputs.enable_debug || 'false' }}

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential libssl-dev libncurses5-dev \
            bison flex libelf-dev bc cpio rsync \
            python3 python3-pip python3-setuptools \
            device-tree-compiler lz4 lzop \
            ccache pigz qemu-user-static
      
      - name: Set up toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          
          if [[ ! -d "aarch64-linux-android-4.9" ]]; then
            git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          fi
          
          if [[ ! -d "arm-linux-androideabi-4.9" ]]; then
            git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          fi
          
          echo "$PWD/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH
          echo "$PWD/arm-linux-androideabi-4.9/bin" >> $GITHUB_PATH
      
      - name: Clone kernel source
        run: |
          git clone --depth 1 -b "${{ env.KERNEL_VERSION }}" \
            https://android.googlesource.com/kernel/common kernel
      
      - name: Configure kernel (GKI + LXC/Docker)
        run: |
          cd kernel
          
          # Base GKI config
          make O=../out gki_defconfig
          
          # LXC/Docker required configs
          cat >> ../out/.config << 'EOF'
# Namespaces
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
