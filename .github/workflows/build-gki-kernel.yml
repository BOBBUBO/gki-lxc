# Keys
CONFIG_KEYS=y
CONFIG_KEYS_REQUEST_CACHE=y
CONFIG_PERSISTENT_KEYRINGS=y
CONFIG_BIG_KEYS=y
CONFIG_TRUSTED_KEYS=y
CONFIG_ENCRYPTED_KEYS=y
CONFIG_KEY_DH_OPERATIONS=y

# BPF
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_LSM=y
CONFIG_BPF_PRELOAD=y
CONFIG_BPF_PRELOAD_UMD=y
CONFIG_HAVE_EBPF_JIT=y

# Seccomp
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# Device drivers
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_STANDALONE=y
CONFIG_PREVENT_FIRMWARE_BUILD=y

# Block devices
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_LOOP_MIN_COUNT=8
CONFIG_BLK_DEV_NBD=y
CONFIG_BLK_DEV_RAM=y
CONFIG_BLK_DEV_RAM_COUNT=16
CONFIG_BLK_DEV_RAM_SIZE=16384

# Android
CONFIG_ANDROID=y
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_ANDROID_BINDERFS=y
CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
CONFIG_ANDROID_BINDER_IPC_SELFTEST=y
CONFIG_ANDROID_LOGGER=y
CONFIG_ANDROID_TIMED_OUTPUT=y
CONFIG_ANDROID_TIMED_GPIO=y
CONFIG_ANDROID_LOW_MEMORY_KILLER=y
CONFIG_ANDROID_LOW_MEMORY_KILLER_AUTODETECT_OOM_ADJ_VALUES=y

# IPC
CONFIG_SYSVIPC=y
CONFIG_SYSVIPC_SYSCTL=y
CONFIG_POSIX_MQUEUE=y
CONFIG_POSIX_MQUEUE_SYSCTL=y
CONFIG_CROSS_MEMORY_ATTACH=y
CONFIG_HAVE_ARCH_SECCOMP_FILTER=y
CONFIG_SECCOMP_FILTER=y

# Audit
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
CONFIG_AUDIT_WATCH=y
CONFIG_AUDIT_TREE=y

# Kprobes
CONFIG_KPROBES=y
CONFIG_KRETPROBES=y
CONFIG_UPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_HAVE_KRETPROBES=y
CONFIG_HAVE_UPROBES=y

# Modules
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MODVERSIONS=y
CONFIG_MODULE_SRCVERSION_ALL=y
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA512=y
CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"
CONFIG_SYSTEM_TRUSTED_KEYRING=y
CONFIG_SYSTEM_EXTRA_CERTIFICATE=y
EOF
          
          # Debug configs if enabled
          if [[ "${{ env.ENABLE_DEBUG }}" == "true" ]]; then
            cat >> ../out/.config << 'EOF'
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_DWARF4=y
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_FS=y
CONFIG_DEBUG_KMEMLEAK=y
CONFIG_DEBUG_STACK_USAGE=y
CONFIG_DEBUG_VM=y
CONFIG_DEBUG_VIRTUAL=y
CONFIG_DEBUG_MEMORY_INIT=y
CONFIG_DEBUG_PER_CPU_MAPS=y
CONFIG_DEBUG_HIGHMEM=y
CONFIG_PROVE_LOCKING=y
CONFIG_LOCK_STAT=y
CONFIG_DEBUG_RT_MUTEXES=y
CONFIG_DEBUG_SPINLOCK=y
CONFIG_DEBUG_MUTEXES=y
CONFIG_DEBUG_RWSEMS=y
CONFIG_DEBUG_LOCK_ALLOC=y
CONFIG_DEBUG_ATOMIC_SLEEP=y
CONFIG_DEBUG_LOCKDEP=y
CONFIG_DEBUG_SLAB=y
CONFIG_SLUB_DEBUG_ON=y
CONFIG_SLUB_STATS=y
EOF
          fi
          
          # Resolve dependencies
          make O=../out olddefconfig
      
      - name: Build kernel
        run: |
          cd kernel
          
          # Set up ccache
          export CCACHE_DIR="${{ github.workspace }}/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          
          export CC="ccache aarch64-linux-android-gcc"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export SUBARCH=arm64
          
          make O=../out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc) \
            2>&1 | tee ../build.log
      
      - name: Package kernel artifacts
        run: |
          mkdir -p out/dist
          
          # Copy Image
          find out -name "Image" -exec cp {} out/dist/ \;
          
          # Copy DTBs
          find out -name "*.dtb" -exec cp {} out/dist/ \;
          
          # Copy modules
          find out -name "*.ko" -exec cp {} out/dist/ \;
          
          # Create kernel version file
          if [[ -f out/.config ]]; then
            grep "CONFIG_LOCALVERSION=" out/.config | cut -d'"' -f2 > out/dist/kernel_version.txt || echo "unknown" > out/dist/kernel_version.txt
          fi
          
          ls -la out/dist/
      
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-${{ env.KERNEL_VERSION }}-lxc-docker
          path: |
            out/dist/**
            build.log
          retention-days: 30
      
      - name: Upload ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-${{ runner.os }}-${{ env.KERNEL_VERSION }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.KERNEL_VERSION }}
            ccache-${{ runner.os }}-
      
      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Version**: ${{ env.KERNEL_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug Enabled**: ${{ env.ENABLE_DEBUG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [[ -f out/dist/Image ]]; then
            echo "- **Kernel Image**: ✅ Built" >> $GITHUB_STEP_SUMMARY
            ls -lh out/dist/Image >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Kernel Image**: ❌ Not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### LXC/Docker Support" >> $GITHUB_STEP_SUMMARY
          echo "All required kernel configs for LXC/Docker have been enabled." >> $GITHUB_STEP_SUMMARY